# Prepared blueprint. No deployment was performed during development.
services:
  - type: web
    name: salonos
    runtime: node
    buildCommand: npm ci --include=dev && npm run typecheck && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: salonos-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        value: https://salonos.onrender.com
databases:
  - name: salonos-postgres
    databaseName: salonos
    user: salonos
